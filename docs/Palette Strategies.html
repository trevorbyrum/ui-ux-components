<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palette Strategies</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const sans = '"DM Sans", sans-serif';
const serif = '"Source Serif 4", serif';

/* ── Strategy cards ── */
function StrategyCard({ strategy }) {
  const s = strategy;
  return (
    <div style={{ width: 520, fontFamily: sans, borderRadius: 2, overflow: 'hidden' }}>
      {/* Header band */}
      <div style={{ background: s.headerBg, color: s.headerFg, padding: '28px 32px' }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.5, textTransform: 'uppercase', opacity: 0.6, marginBottom: 6 }}>{s.label}</div>
        <div style={{ fontFamily: serif, fontSize: 26, fontWeight: 400, letterSpacing: -0.3 }}>{s.name}</div>
        <div style={{ fontSize: 13, marginTop: 6, opacity: 0.75, lineHeight: 1.5 }}>{s.desc}</div>
      </div>

      {/* Palette strip */}
      <div style={{ display: 'flex', height: 48 }}>
        {s.strip.map((c, i) => (
          <div key={i} style={{ flex: 1, background: c }} />
        ))}
      </div>

      {/* Sample UI */}
      <div style={{ background: s.pageBg, padding: 28 }}>
        {/* Buttons */}
        <div style={{ display: 'flex', gap: 10, marginBottom: 20, flexWrap: 'wrap', alignItems: 'center' }}>
          <button style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, padding: '8px 18px', background: s.btnPrimary, color: s.btnPrimaryFg, border: 'none', borderRadius: 6, cursor: 'pointer' }}>Primary</button>
          {s.btnSecondary && (
            <button style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, padding: '8px 18px', background: s.btnSecondary, color: s.btnSecondaryFg, border: 'none', borderRadius: 6, cursor: 'pointer' }}>Secondary</button>
          )}
          <button style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, padding: '8px 18px', background: 'transparent', color: s.textPrimary, border: `1.5px solid ${s.borderColor}`, borderRadius: 6, cursor: 'pointer' }}>Outline</button>
        </div>

        {/* Card */}
        <div style={{ background: s.cardBg, borderRadius: 6, padding: 18, border: `1px solid ${s.borderColor}`, boxShadow: '0 1px 4px rgba(0,0,0,0.06)', display: 'flex', gap: 14, alignItems: 'center', marginBottom: 16 }}>
          <div style={{ width: 42, height: 42, borderRadius: 6, background: s.iconBg, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ width: 18, height: 18, borderRadius: '50%', background: s.iconFg }} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: s.textPrimary }}>Card heading</div>
            <div style={{ fontSize: 13, color: s.textSecondary }}>Supporting description text here</div>
          </div>
          <div style={{ fontSize: 12, fontWeight: 500, color: s.linkColor, cursor: 'pointer' }}>View →</div>
        </div>

        {/* Input */}
        <div style={{ padding: '9px 14px', borderRadius: 6, fontSize: 13, fontFamily: sans, border: `1.5px solid ${s.borderColor}`, background: s.inputBg, color: s.textTertiary }}>Search or type a command…</div>
      </div>
    </div>
  );
}

/* ── 1. Single Accent (what we've been doing) ── */
const singleAccent = {
  label: 'Strategy 1', name: 'Single Accent + Neutrals',
  desc: 'One strong color for actions. Everything else is gray. The safe default — but can feel flat.',
  headerBg: '#1a1e2c', headerFg: '#e8eaf0',
  strip: ['#1a1e2c', '#5b6173', '#8f95a6', '#dfe3ea', '#f6f7fa', 'oklch(0.48 0.2 275)', 'oklch(0.93 0.04 275)'],
  pageBg: '#f6f7fa', cardBg: '#fff', inputBg: '#fff',
  borderColor: '#dde0ea',
  btnPrimary: 'oklch(0.48 0.2 275)', btnPrimaryFg: '#fff',
  btnSecondary: null,
  textPrimary: '#1a1e2c', textSecondary: '#5b6173', textTertiary: '#8f95a6',
  linkColor: 'oklch(0.48 0.2 275)',
  iconBg: 'oklch(0.93 0.04 275)', iconFg: 'oklch(0.48 0.2 275)',
};

/* ── 2. Duotone ── */
const duotone = {
  label: 'Strategy 2', name: 'Duotone',
  desc: 'Two colors that play off each other — primary for actions, secondary for highlights and navigation. More personality.',
  headerBg: 'oklch(0.35 0.15 275)', headerFg: '#e4e0f8',
  strip: ['oklch(0.35 0.15 275)', 'oklch(0.48 0.2 275)', 'oklch(0.65 0.18 275)', 'oklch(0.55 0.16 160)', 'oklch(0.72 0.12 160)', '#f4f5f8', '#ffffff'],
  pageBg: '#f4f5f8', cardBg: '#fff', inputBg: '#fff',
  borderColor: '#dde0ea',
  btnPrimary: 'oklch(0.48 0.2 275)', btnPrimaryFg: '#fff',
  btnSecondary: 'oklch(0.55 0.16 160)', btnSecondaryFg: '#fff',
  textPrimary: '#161828', textSecondary: '#5a5c72', textTertiary: '#8b8ea2',
  linkColor: 'oklch(0.48 0.2 275)',
  iconBg: 'oklch(0.92 0.06 160)', iconFg: 'oklch(0.48 0.14 160)',
};

/* ── 3. Tinted Neutrals ── */
const tintedNeutrals = {
  label: 'Strategy 3', name: 'Tinted Neutrals',
  desc: 'No pure grays — every neutral is subtly tinted with the accent hue. Cohesive and premium feeling.',
  headerBg: 'oklch(0.28 0.06 275)', headerFg: 'oklch(0.9 0.02 275)',
  strip: ['oklch(0.28 0.06 275)', 'oklch(0.42 0.04 275)', 'oklch(0.58 0.03 275)', 'oklch(0.78 0.02 275)', 'oklch(0.92 0.015 275)', 'oklch(0.96 0.01 275)', 'oklch(0.48 0.2 275)'],
  pageBg: 'oklch(0.96 0.01 275)', cardBg: '#fff', inputBg: 'oklch(0.98 0.005 275)',
  borderColor: 'oklch(0.88 0.02 275)',
  btnPrimary: 'oklch(0.48 0.2 275)', btnPrimaryFg: '#fff',
  btnSecondary: null,
  textPrimary: 'oklch(0.22 0.06 275)', textSecondary: 'oklch(0.45 0.04 275)', textTertiary: 'oklch(0.6 0.03 275)',
  linkColor: 'oklch(0.48 0.2 275)',
  iconBg: 'oklch(0.92 0.03 275)', iconFg: 'oklch(0.48 0.2 275)',
};

/* ── 4. Dark-forward ── */
const darkForward = {
  label: 'Strategy 4', name: 'Dark-Forward',
  desc: 'Dark surfaces as the default — not a "dark mode" but the primary identity. Light mode is the alternate.',
  headerBg: '#0c0c12', headerFg: '#e8e8f0',
  strip: ['#0c0c12', '#181822', '#242430', '#363646', '#e8e8f0', 'oklch(0.7 0.2 275)', 'oklch(0.65 0.18 160)'],
  pageBg: '#111118', cardBg: '#1c1c26', inputBg: '#1c1c26',
  borderColor: '#2a2a3a',
  btnPrimary: 'oklch(0.7 0.2 275)', btnPrimaryFg: '#111118',
  btnSecondary: 'oklch(0.65 0.18 160)', btnSecondaryFg: '#111118',
  textPrimary: '#e8e8f0', textSecondary: '#9898a8', textTertiary: '#6a6a7a',
  linkColor: 'oklch(0.7 0.2 275)',
  iconBg: '#2a2a3a', iconFg: 'oklch(0.7 0.2 275)',
};

/* ── 5. Analogous Triad ── */
const analogous = {
  label: 'Strategy 5', name: 'Analogous Range',
  desc: 'Three neighboring hues (indigo → blue → cyan) for a rich but harmonious multi-color system. Each color has a role.',
  headerBg: 'oklch(0.32 0.12 260)', headerFg: 'oklch(0.9 0.03 240)',
  strip: ['oklch(0.48 0.2 275)', 'oklch(0.5 0.18 240)', 'oklch(0.52 0.16 210)', 'oklch(0.92 0.04 275)', 'oklch(0.92 0.04 240)', 'oklch(0.92 0.04 210)', '#f5f6fa'],
  pageBg: '#f5f6fa', cardBg: '#fff', inputBg: '#fff',
  borderColor: '#dde0ea',
  btnPrimary: 'oklch(0.48 0.2 275)', btnPrimaryFg: '#fff',
  btnSecondary: 'oklch(0.52 0.16 210)', btnSecondaryFg: '#fff',
  textPrimary: '#161828', textSecondary: '#5a5c72', textTertiary: '#8b8ea2',
  linkColor: 'oklch(0.5 0.18 240)',
  iconBg: 'oklch(0.92 0.04 210)', iconFg: 'oklch(0.48 0.14 210)',
};

/* ── 6. Contrast Pop ── */
const contrastPop = {
  label: 'Strategy 6', name: 'Contrast Pop',
  desc: 'Mostly monochrome with one unexpected, high-saturation color used sparingly for maximum impact.',
  headerBg: '#1a1a1a', headerFg: '#f0f0f0',
  strip: ['#1a1a1a', '#444', '#888', '#ccc', '#f0f0f0', '#fff', 'oklch(0.65 0.27 35)'],
  pageBg: '#f5f5f5', cardBg: '#fff', inputBg: '#fff',
  borderColor: '#e0e0e0',
  btnPrimary: 'oklch(0.65 0.27 35)', btnPrimaryFg: '#fff',
  btnSecondary: null,
  textPrimary: '#1a1a1a', textSecondary: '#666', textTertiary: '#999',
  linkColor: 'oklch(0.65 0.27 35)',
  iconBg: 'oklch(0.95 0.04 35)', iconFg: 'oklch(0.6 0.24 35)',
};

function App() {
  return (
    <DesignCanvas>
      <DCSection title="Palette Strategy Overview" subtitle="Six fundamentally different approaches to color. Pick a strategy first, then we dial in exact hues.">
        <DCArtboard label="1 · Single Accent + Neutrals" width={520} height={440}>
          <StrategyCard strategy={singleAccent} />
        </DCArtboard>
        <DCArtboard label="2 · Duotone" width={520} height={440}>
          <StrategyCard strategy={duotone} />
        </DCArtboard>
        <DCArtboard label="3 · Tinted Neutrals" width={520} height={440}>
          <StrategyCard strategy={tintedNeutrals} />
        </DCArtboard>
      </DCSection>

      <DCSection title="More Approaches" subtitle="Bolder structural choices.">
        <DCArtboard label="4 · Dark-Forward" width={520} height={440}>
          <StrategyCard strategy={darkForward} />
        </DCArtboard>
        <DCArtboard label="5 · Analogous Range" width={520} height={440}>
          <StrategyCard strategy={analogous} />
        </DCArtboard>
        <DCArtboard label="6 · Contrast Pop" width={520} height={440}>
          <StrategyCard strategy={contrastPop} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
