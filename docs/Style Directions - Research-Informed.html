/*
  DESIGN RATIONALE (per research docs):
  
  - 60-30-10 rule: 60% neutral bg, 30% secondary surfaces, 10% accent
  - Color psychology: each direction uses a different emotional register
  - Aesthetic-usability effect: beautiful = perceived as more usable
  - Pre-attentive processing: accent must differ on a single feature (hue/saturation) for instant pop
  - Tinted neutrals: grays tinted toward accent hue feel more cohesive (not flat)
  - Cognitive load: clean hierarchy, not competing visual noise
  - Von Restorff: CTA must be the ONLY saturated element
  - 8px spacing grid throughout
*/

function DirectionPage({ d }) {
  const card = {
    background: d.cardBg, borderRadius: d.radius, padding: 24,
    border: `1px solid ${d.cardBorder}`, boxShadow: d.cardShadow,
  };
  return (
    <div style={{ width: 640, fontFamily: d.sans, color: d.fg1, background: d.pageBg, borderRadius: 2, overflow: 'hidden' }}>
      {/* Hero band — 60-30-10: this is the 30% secondary */}
      <div style={{ background: d.heroBg, color: d.heroFg, padding: '32px 36px 28px' }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.8, textTransform: 'uppercase', opacity: 0.5, marginBottom: 10 }}>{d.tag}</div>
        <h2 style={{ fontFamily: d.display, fontSize: 30, fontWeight: d.displayWeight, letterSpacing: -0.4, marginBottom: 8, lineHeight: 1.15 }}>{d.name}</h2>
        <p style={{ fontSize: 14, lineHeight: 1.6, opacity: 0.8, maxWidth: 480 }}>{d.desc}</p>
      </div>

      {/* Color strip */}
      <div style={{ display: 'flex', height: 6 }}>
        {d.strip.map((c, i) => <div key={i} style={{ flex: 1, background: c }} />)}
      </div>

      {/* Page body — this is the 60% dominant */}
      <div style={{ padding: 32, display: 'flex', flexDirection: 'column', gap: 20 }}>
        
        {/* Palette + Rationale */}
        <div style={{ display: 'flex', gap: 20 }}>
          <div style={{ ...card, flex: 1 }}>
            <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, textTransform: 'uppercase', color: d.fg3, marginBottom: 14 }}>Palette</div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {d.swatches.map((s, i) => (
                <div key={i} style={{ textAlign: 'center' }}>
                  <div style={{ width: 44, height: 44, borderRadius: 6, background: s.color, border: '1px solid rgba(0,0,0,0.08)' }} />
                  <div style={{ fontSize: 9, color: d.fg3, marginTop: 4 }}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{ ...card, flex: 1 }}>
            <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, textTransform: 'uppercase', color: d.fg3, marginBottom: 14 }}>Why this works</div>
            <p style={{ fontSize: 13, color: d.fg2, lineHeight: 1.6 }}>{d.rationale}</p>
          </div>
        </div>

        {/* Typography */}
        <div style={{ ...card }}>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, textTransform: 'uppercase', color: d.fg3, marginBottom: 16 }}>Typography</div>
          <div style={{ display: 'flex', gap: 32 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: d.display, fontSize: 28, fontWeight: d.displayWeight, letterSpacing: -0.3, marginBottom: 2, lineHeight: 1.2 }}>Display Heading</div>
              <div style={{ fontSize: 10, color: d.fg3, marginBottom: 16 }}>{d.displayLabel}</div>
              <div style={{ fontFamily: d.sans, fontSize: 18, fontWeight: 600, marginBottom: 2 }}>Section Heading</div>
              <div style={{ fontFamily: d.sans, fontSize: 14, color: d.fg2, lineHeight: 1.6 }}>Body text — clear, legible, and balanced. Good typography induces better mood and improves creative task performance.</div>
            </div>
            <div style={{ width: 1, background: d.cardBorder }} />
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: d.sans, fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Type Scale (1.250)</div>
              {[{s: 32, l: 'H1'}, {s: 24, l: 'H2'}, {s: 18, l: 'H3'}, {s: 14, l: 'Body'}, {s: 12, l: 'Small'}].map((t, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginBottom: 6 }}>
                  <span style={{ fontSize: 10, color: d.fg3, width: 36 }}>{t.l}</span>
                  <span style={{ fontFamily: i < 2 ? d.display : d.sans, fontSize: t.s, fontWeight: i < 2 ? d.displayWeight : (i === 2 ? 600 : 400), lineHeight: 1.2, letterSpacing: i < 2 ? -0.3 : 0 }}>Aa</span>
                  <span style={{ fontSize: 10, color: d.fg3 }}>{t.s}px</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Components */}
        <div style={{ ...card }}>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, textTransform: 'uppercase', color: d.fg3, marginBottom: 16 }}>Components</div>
          
          {/* Buttons — Von Restorff: primary is the only saturated element */}
          <div style={{ display: 'flex', gap: 10, marginBottom: 20, flexWrap: 'wrap', alignItems: 'center' }}>
            <button style={{ fontFamily: d.sans, fontSize: 13, fontWeight: 600, padding: '10px 20px', background: d.accent, color: d.accentFg, border: 'none', borderRadius: d.radius, cursor: 'pointer', transition: 'all 150ms ease-out' }}>Primary Action</button>
            <button style={{ fontFamily: d.sans, fontSize: 13, fontWeight: 600, padding: '10px 20px', background: d.secondaryBtn, color: d.secondaryBtnFg, border: `1.5px solid ${d.secondaryBtnBorder}`, borderRadius: d.radius, cursor: 'pointer' }}>Secondary</button>
            <button style={{ fontFamily: d.sans, fontSize: 13, fontWeight: 500, padding: '10px 20px', background: d.ghostBtn, color: d.ghostBtnFg, border: 'none', borderRadius: d.radius, cursor: 'pointer' }}>Ghost</button>
            <button style={{ fontFamily: d.sans, fontSize: 13, fontWeight: 500, color: d.accent, background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: 3 }}>Link</button>
          </div>

          {/* Input */}
          <div style={{ marginBottom: 20 }}>
            <label style={{ fontSize: 13, fontWeight: 500, color: d.fg2, display: 'block', marginBottom: 6 }}>Email address</label>
            <div style={{ display: 'flex', gap: 8 }}>
              <div style={{ flex: 1, padding: '10px 14px', borderRadius: d.radius, fontSize: 14, fontFamily: d.sans, border: `1.5px solid ${d.cardBorder}`, background: d.inputBg, color: d.fg3 }}>you@example.com</div>
              <button style={{ fontFamily: d.sans, fontSize: 13, fontWeight: 600, padding: '10px 20px', background: d.accent, color: d.accentFg, border: 'none', borderRadius: d.radius, cursor: 'pointer' }}>Subscribe</button>
            </div>
          </div>

          {/* Cards — Gestalt Common Region */}
          <div style={{ display: 'flex', gap: 12 }}>
            {[
              { title: 'Analytics', sub: 'Track performance metrics' },
              { title: 'Reports', sub: 'Generate weekly summaries' },
              { title: 'Settings', sub: 'Configure your workspace' },
            ].map((item, i) => (
              <div key={i} style={{
                flex: 1, background: d.nestedCardBg, borderRadius: d.radius, padding: 16,

                <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>{item.title}</div>
                <div style={{ fontSize: 12, color: d.fg2, lineHeight: 1.5 }}>{item.sub}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
