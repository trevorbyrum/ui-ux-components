<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Style Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Space+Grotesk:wght@300..700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

/* ── Direction A: Cool & Structured ── */
const dirA = {
  name: 'Cool & Structured',
  desc: 'Slate neutrals · Clean geometry · Thin borders · DM Sans + Source Serif 4',
  sans: '"DM Sans", sans-serif',
  serif: '"Source Serif 4", serif',
  bg: '#f8f9fb',
  surface: '#ffffff',
  surfaceAlt: '#f1f3f7',
  border: '#dfe3ea',
  fg1: '#1a1e2c',
  fg2: '#5b6173',
  fg3: '#8f95a6',
  accent: 'oklch(0.55 0.18 250)',       // blue
  accentSoft: 'oklch(0.92 0.04 250)',
  accentText: '#fff',
  secondary: 'oklch(0.55 0.18 170)',     // teal
  danger: 'oklch(0.55 0.18 25)',
  radius: '6px',
  shadow: '0 1px 3px rgba(0,0,0,0.06)',
  shadowLg: '0 4px 16px rgba(0,0,0,0.08)',
  borderStyle: '1px solid #dfe3ea',
};

/* ── Direction B: Warm & Grounded ── */
const dirB = {
  name: 'Warm & Grounded',
  desc: 'Stone neutrals · Soft shadows · Earthy warmth · Manrope + Newsreader',
  sans: '"Manrope", sans-serif',
  serif: '"Newsreader", serif',
  bg: '#faf8f5',
  surface: '#ffffff',
  surfaceAlt: '#f5f1ec',
  border: '#e6dfd5',
  fg1: '#2c2418',
  fg2: '#6b5f4f',
  fg3: '#9c927f',
  accent: 'oklch(0.58 0.16 55)',        // amber/rust
  accentSoft: 'oklch(0.93 0.04 55)',
  accentText: '#fff',
  secondary: 'oklch(0.55 0.14 155)',     // sage
  danger: 'oklch(0.55 0.16 20)',
  radius: '8px',
  shadow: '0 2px 8px rgba(50,30,10,0.07)',
  shadowLg: '0 6px 24px rgba(50,30,10,0.1)',
  borderStyle: 'none',
};

/* ── Direction C: Bold & Modern ── */
const dirC = {
  name: 'Bold & Modern',
  desc: 'High contrast · Vibrant accent · Crisp type · Space Grotesk + Instrument Serif',
  sans: '"Space Grotesk", sans-serif',
  serif: '"Instrument Serif", serif',
  bg: '#f4f4f6',
  surface: '#ffffff',
  surfaceAlt: '#eeeef2',
  border: '#d8d8e0',
  fg1: '#111118',
  fg2: '#55555e',
  fg3: '#88889a',
  accent: 'oklch(0.6 0.22 295)',        // vivid purple
  accentSoft: 'oklch(0.93 0.06 295)',
  accentText: '#fff',
  secondary: 'oklch(0.6 0.22 165)',      // emerald
  danger: 'oklch(0.58 0.2 25)',
  radius: '6px',
  shadow: '0 1px 2px rgba(0,0,0,0.05)',
  shadowLg: '0 8px 24px rgba(0,0,0,0.12)',
  borderStyle: '1px solid #d8d8e0',
};

/* ── Color Swatch ── */
function Swatch({ color, label, size = 40 }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
      <div style={{ width: size, height: size, borderRadius: 6, background: color, border: '1px solid rgba(0,0,0,0.08)' }} />
      {label && <span style={{ fontSize: 10, opacity: 0.6 }}>{label}</span>}
    </div>
  );
}

/* ── Direction Card ── */
function DirectionCard({ d, letter }) {
  return (
    <div style={{
      width: 580, background: d.bg, padding: 36, fontFamily: d.sans,
      color: d.fg1, borderRadius: 2, overflow: 'hidden',
    }}>
      {/* Header */}
      <div style={{ marginBottom: 28 }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.5, textTransform: 'uppercase', color: d.fg3, marginBottom: 8 }}>
          Direction {letter}
        </div>
        <h2 style={{ fontFamily: d.serif, fontSize: 32, fontWeight: 400, letterSpacing: -0.5, marginBottom: 6 }}>
          {d.name}
        </h2>
        <p style={{ fontSize: 14, color: d.fg2, lineHeight: 1.5 }}>{d.desc}</p>
      </div>

      {/* Type specimen */}
      <div style={{ background: d.surface, borderRadius: d.radius, padding: 24, border: d.borderStyle, boxShadow: d.borderStyle === 'none' ? d.shadow : 'none', marginBottom: 20 }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, textTransform: 'uppercase', color: d.fg3, marginBottom: 14 }}>Typography</div>
        <div style={{ fontFamily: d.serif, fontSize: 28, fontWeight: 400, marginBottom: 4, letterSpacing: -0.3 }}>Display Heading</div>
        <div style={{ fontFamily: d.sans, fontSize: 20, fontWeight: 600, marginBottom: 4 }}>Section Heading</div>
        <div style={{ fontFamily: d.sans, fontSize: 15, fontWeight: 500, marginBottom: 4 }}>Subtitle text</div>
        <div style={{ fontFamily: d.sans, fontSize: 14, color: d.fg2, lineHeight: 1.6 }}>Body text — the quick brown fox jumps over the lazy dog. Clean, legible, and balanced for long-form reading.</div>
      </div>

      {/* Colors */}
      <div style={{ background: d.surface, borderRadius: d.radius, padding: 24, border: d.borderStyle, boxShadow: d.borderStyle === 'none' ? d.shadow : 'none', marginBottom: 20 }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, textTransform: 'uppercase', color: d.fg3, marginBottom: 14 }}>Palette</div>
        <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
          <Swatch color={d.fg1} label="fg1" />
          <Swatch color={d.fg2} label="fg2" />
          <Swatch color={d.fg3} label="fg3" />
          <Swatch color={d.border} label="border" />
          <Swatch color={d.surfaceAlt} label="alt" />
          <Swatch color={d.accent} label="accent" />
          <Swatch color={d.secondary} label="secondary" />
          <Swatch color={d.danger} label="danger" />
        </div>
      </div>

      {/* Sample Components */}
      <div style={{ background: d.surface, borderRadius: d.radius, padding: 24, border: d.borderStyle, boxShadow: d.borderStyle === 'none' ? d.shadow : 'none' }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, textTransform: 'uppercase', color: d.fg3, marginBottom: 14 }}>Components</div>
        
        {/* Buttons */}
        <div style={{ display: 'flex', gap: 10, marginBottom: 18, flexWrap: 'wrap', alignItems: 'center' }}>
          <button style={{
            fontFamily: d.sans, fontSize: 14, fontWeight: 600, padding: '9px 20px',
            background: d.accent, color: d.accentText, border: 'none', borderRadius: d.radius, cursor: 'pointer',
          }}>Primary</button>
          <button style={{
            fontFamily: d.sans, fontSize: 14, fontWeight: 600, padding: '9px 20px',
            background: 'transparent', color: d.fg1, border: `1.5px solid ${d.border}`, borderRadius: d.radius, cursor: 'pointer',
          }}>Secondary</button>
          <button style={{
            fontFamily: d.sans, fontSize: 14, fontWeight: 500, padding: '9px 20px',
            background: d.accentSoft, color: d.accent, border: 'none', borderRadius: d.radius, cursor: 'pointer',
          }}>Soft</button>
          <button style={{
            fontFamily: d.sans, fontSize: 14, fontWeight: 500, padding: '9px 16px',
            background: 'transparent', color: d.fg2, border: 'none', cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: 3,
          }}>Link</button>
        </div>

        {/* Input */}
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 6, color: d.fg2 }}>Email address</div>
          <div style={{
            padding: '10px 14px', borderRadius: d.radius, fontSize: 14, fontFamily: d.sans,
            border: `1.5px solid ${d.border}`, background: d.bg, color: d.fg3,
          }}>you@example.com</div>
        </div>

        {/* Card preview */}
        <div style={{
          background: d.surfaceAlt, borderRadius: d.radius, padding: 18,
          border: d.borderStyle, boxShadow: d.borderStyle === 'none' ? d.shadow : 'none',
          display: 'flex', gap: 14, alignItems: 'center',
        }}>
          <div style={{ width: 44, height: 44, borderRadius: d.radius, background: d.accentSoft, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ width: 20, height: 20, borderRadius: '50%', background: d.accent }} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>Card title</div>
            <div style={{ fontSize: 13, color: d.fg2 }}>Supporting description text</div>
          </div>
          <div style={{ fontSize: 12, fontWeight: 500, color: d.accent, cursor: 'pointer' }}>View →</div>
        </div>
      </div>
    </div>
  );
}

/* ── Dark Mode Preview ── */
function DarkPreview({ d, letter }) {
  const dark = {
    bg: '#111118',
    surface: '#1a1a24',
    surfaceAlt: '#222230',
    border: '#2e2e3e',
    fg1: '#ebebf0',
    fg2: '#9898a8',
    fg3: '#6a6a7a',
  };
  return (
    <div style={{
      width: 580, background: dark.bg, padding: 36, fontFamily: d.sans,
      color: dark.fg1, borderRadius: 2, overflow: 'hidden',
    }}>
      <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.5, textTransform: 'uppercase', color: dark.fg3, marginBottom: 8 }}>
        Direction {letter} — Dark
      </div>
      <h2 style={{ fontFamily: d.serif, fontSize: 28, fontWeight: 400, letterSpacing: -0.3, marginBottom: 20 }}>
        {d.name}
      </h2>

      {/* Buttons */}
      <div style={{ display: 'flex', gap: 10, marginBottom: 20, alignItems: 'center' }}>
        <button style={{
          fontFamily: d.sans, fontSize: 14, fontWeight: 600, padding: '9px 20px',
          background: d.accent, color: d.accentText, border: 'none', borderRadius: d.radius, cursor: 'pointer',
        }}>Primary</button>
        <button style={{
          fontFamily: d.sans, fontSize: 14, fontWeight: 600, padding: '9px 20px',
          background: 'transparent', color: dark.fg1, border: `1.5px solid ${dark.border}`, borderRadius: d.radius, cursor: 'pointer',
        }}>Secondary</button>
        <button style={{
          fontFamily: d.sans, fontSize: 14, fontWeight: 500, padding: '9px 20px',
          background: dark.surfaceAlt, color: d.accent, border: 'none', borderRadius: d.radius, cursor: 'pointer',
        }}>Soft</button>
      </div>

      {/* Input */}
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 6, color: dark.fg2 }}>Email address</div>
        <div style={{
          padding: '10px 14px', borderRadius: d.radius, fontSize: 14, fontFamily: d.sans,
          border: `1.5px solid ${dark.border}`, background: dark.surface, color: dark.fg3,
        }}>you@example.com</div>
      </div>

      {/* Card */}
      <div style={{
        background: dark.surface, borderRadius: d.radius, padding: 18,
        border: `1px solid ${dark.border}`,
        display: 'flex', gap: 14, alignItems: 'center',
      }}>
        <div style={{ width: 44, height: 44, borderRadius: d.radius, background: dark.surfaceAlt, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ width: 20, height: 20, borderRadius: '50%', background: d.accent }} />
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>Card title</div>
          <div style={{ fontSize: 13, color: dark.fg2 }}>Supporting description text</div>
        </div>
        <div style={{ fontSize: 12, fontWeight: 500, color: d.accent, cursor: 'pointer' }}>View →</div>
      </div>
    </div>
  );
}

/* ── Border Treatment Comparison ── */
function BorderComparison() {
  const styles = [
    { name: 'Thin borders', desc: 'Crisp, flat, structured', css: { border: '1px solid #dfe3ea', boxShadow: 'none' }},
    { name: 'Subtle shadows', desc: 'Floating, soft, modern', css: { border: 'none', boxShadow: '0 2px 8px rgba(0,0,0,0.08)' }},
    { name: 'Border + shadow', desc: 'Defined yet elevated', css: { border: '1px solid #eee', boxShadow: '0 2px 8px rgba(0,0,0,0.05)' }},
    { name: 'Inset / recessed', desc: 'Embedded, field-like', css: { border: '1px solid #e0e0e0', boxShadow: 'inset 0 1px 3px rgba(0,0,0,0.06)' }},
  ];
  return (
    <div style={{ width: 580, background: '#fafafa', padding: 36, fontFamily: '"DM Sans", sans-serif', borderRadius: 2 }}>
      <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.5, textTransform: 'uppercase', color: '#888', marginBottom: 20 }}>
        Border & Surface Treatments
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        {styles.map((s, i) => (
          <div key={i} style={{ background: '#fff', borderRadius: 8, padding: 20, ...s.css }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>{s.name}</div>
            <div style={{ fontSize: 13, color: '#777' }}>{s.desc}</div>
            <div style={{ marginTop: 14, display: 'flex', gap: 8 }}>
              <button style={{ padding: '7px 16px', fontSize: 13, fontWeight: 600, background: 'oklch(0.55 0.18 250)', color: '#fff', border: 'none', borderRadius: 6, cursor: 'pointer' }}>Button</button>
              <div style={{ flex: 1, padding: '7px 12px', fontSize: 13, borderRadius: 6, ...s.css, background: '#fafafa', color: '#aaa' }}>Input field</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection title="Three Visual Directions" subtitle="Compare type, color, and tone — pick one to build from, or mix elements across directions.">
        <DCArtboard label="A · Cool & Structured" width={580} height={720}>
          <DirectionCard d={dirA} letter="A" />
        </DCArtboard>
        <DCArtboard label="B · Warm & Grounded" width={580} height={720}>
          <DirectionCard d={dirB} letter="B" />
        </DCArtboard>
        <DCArtboard label="C · Bold & Modern" width={580} height={720}>
          <DirectionCard d={dirC} letter="C" />
        </DCArtboard>
      </DCSection>

      <DCSection title="Dark Mode" subtitle="Each direction in a dark context.">
        <DCArtboard label="A · Dark" width={580} height={380}>
          <DarkPreview d={dirA} letter="A" />
        </DCArtboard>
        <DCArtboard label="B · Dark" width={580} height={380}>
          <DarkPreview d={dirB} letter="B" />
        </DCArtboard>
        <DCArtboard label="C · Dark" width={580} height={380}>
          <DarkPreview d={dirC} letter="C" />
        </DCArtboard>
      </DCSection>

      <DCSection title="Border & Surface Treatments" subtitle="Which container style feels right? These can be mixed per-component.">
        <DCArtboard label="Comparison" width={580} height={380}>
          <BorderComparison />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
