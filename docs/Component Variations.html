<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Component Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="components-extra.jsx"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useMemo, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "hue": 54,
  "mode": "dark"
}/*EDITMODE-END*/;

function App() {
  const [hue, setHue] = useState(TWEAK_DEFAULTS.hue);
  const [mode, setMode] = useState(TWEAK_DEFAULTS.mode);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [checks, setChecks] = useState({ a: true, b: false, c: true });
  const [radio, setRadio] = useState(0);

  const t = useMemo(() => buildTheme(hue, mode), [hue, mode]);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  useEffect(() => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { hue, mode } }, '*');
  }, [hue, mode]);

  const Section = ({ title, children }) => (
    <div style={{ marginBottom: 48 }}>
      <div style={{ fontSize: 10, fontWeight: 500, letterSpacing: 2, textTransform: 'uppercase', color: t.fg3, marginBottom: 16 }}>{title}</div>
      {children}
    </div>
  );

  const Variant = ({ label, children }) => (
    <div style={{ flex: 1 }}>
      <div style={{ fontSize: 10, color: t.fg3, marginBottom: 8, fontWeight: 500 }}>{label}</div>
      {children}
    </div>
  );

  return (
    <div style={{ fontFamily: t.font, background: t.pageBg, color: t.fg1, minHeight: '100vh', padding: '40px 48px', transition: 'background 200ms, color 200ms' }}>

      <div style={{ marginBottom: 48 }}>
        <div style={{ fontSize: 10, fontWeight: 500, letterSpacing: 2, color: t.fg3, marginBottom: 8 }}>COMPONENT VARIATIONS</div>
        <div style={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.8, marginBottom: 6 }}>Pick a style for each component</div>
        <div style={{ fontSize: 14, color: t.fg2, lineHeight: 1.6, maxWidth: 520 }}>
          Each component shown in 2–3 variations. Tell me which you prefer per row.
        </div>
      </div>

      {/* ── CHECKBOX ── */}
      <Section title="Checkbox">
        <div style={{ display: 'flex', gap: 48 }}>
          {['filled', 'outline', 'soft'].map(v => (
            <Variant key={v} label={v}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <Checkbox checked={checks.a} onChange={(val) => setChecks({...checks, a: val})} label="Enable analytics" variant={v} theme={t} />
                <Checkbox checked={checks.b} onChange={(val) => setChecks({...checks, b: val})} label="Send notifications" variant={v} theme={t} />
                <Checkbox checked={checks.c} onChange={(val) => setChecks({...checks, c: val})} label="Dark mode" variant={v} theme={t} />
              </div>
            </Variant>
          ))}
        </div>
      </Section>

      {/* ── RADIO ── */}
      <Section title="Radio">
        <div style={{ display: 'flex', gap: 48 }}>
          {['filled', 'outline', 'soft'].map(v => (
            <Variant key={v} label={v}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {['Startup', 'Growth', 'Enterprise'].map((opt, i) => (
                  <Radio key={i} checked={radio === i} onChange={() => setRadio(i)} label={opt} variant={v} theme={t} />
                ))}
              </div>
            </Variant>
          ))}
        </div>
      </Section>

      {/* ── TEXTAREA ── */}
      <Section title="Textarea">
        <div style={{ display: 'flex', gap: 24, maxWidth: 680 }}>
          {['default', 'raised', 'minimal'].map(v => (
            <Variant key={v} label={v}>
              <Textarea label="Description" placeholder="Enter a description..." variant={v} theme={t} />
            </Variant>
          ))}
        </div>
      </Section>

      {/* ── TOOLTIP ── */}
      <Section title="Tooltip">
        <div style={{ display: 'flex', gap: 48, paddingTop: 32, paddingBottom: 16 }}>
          {['dark', 'subtle', 'accent'].map(v => (
            <Variant key={v} label={v}>
              <Tooltip text="This is a tooltip" variant={v} theme={t}>
                <Button variant="secondary" size="sm" theme={t}>Hover target</Button>
              </Tooltip>
            </Variant>
          ))}
        </div>
      </Section>

      {/* ── DROPDOWN / MENU ── */}
      <Section title="Dropdown Menu">
        <div style={{ display: 'flex', gap: 24 }}>
          {['default', 'raised', 'floating'].map(v => (
            <Variant key={v} label={v}>
              <DropdownMenu variant={v} theme={t} items={[
                { label: 'Edit', active: false },
                { label: 'Duplicate', active: false },
                { label: 'Move to...', active: false },
                '-',
                { label: 'Delete', danger: true },
              ]} />
            </Variant>
          ))}
        </div>
      </Section>

      {/* ── TOAST / NOTIFICATION ── */}
      <Section title="Toast / Notification">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          {['default', 'bar', 'filled'].map(v => (
            <div key={v}>
              <div style={{ fontSize: 10, color: t.fg3, marginBottom: 8, fontWeight: 500 }}>{v}</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <Toast message="Deployment successful" type="success" variant={v} theme={t} />
                <Toast message="API rate limit approaching" type="info" variant={v} theme={t} />
                <Toast message="Build failed — check logs" type="error" variant={v} theme={t} />
              </div>
            </div>
          ))}
        </div>
      </Section>

      {/* ── PROGRESS BAR ── */}
      <Section title="Progress Bar">
        <div style={{ display: 'flex', gap: 32, maxWidth: 560 }}>
          {['thin', 'default', 'thick'].map(v => (
            <Variant key={v} label={v}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <Progress value={35} variant={v} theme={t} />
                <Progress value={70} variant={v} theme={t} />
                <Progress value={100} variant={v} theme={t} />
              </div>
            </Variant>
          ))}
        </div>
      </Section>

      {/* ── SPINNER ── */}
      <Section title="Spinner">
        <div style={{ display: 'flex', gap: 48 }}>
          {['default', 'dots', 'ring'].map(v => (
            <Variant key={v} label={v}>
              <Spinner variant={v} size={22} theme={t} />
            </Variant>
          ))}
        </div>
      </Section>

      {/* ── BREADCRUMBS ── */}
      <Section title="Breadcrumbs">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {['slash', 'arrow', 'dot'].map(v => (
            <div key={v} style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
              <div style={{ fontSize: 10, color: t.fg3, width: 50, fontWeight: 500 }}>{v}</div>
              <Breadcrumbs items={['Home', 'Projects', 'Acme Inc', 'Settings']} variant={v} theme={t} />
            </div>
          ))}
        </div>
      </Section>

      {/* ── PAGINATION ── */}
      <Section title="Pagination">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          {['default', 'bordered', 'minimal'].map(v => (
            <div key={v} style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
              <div style={{ fontSize: 10, color: t.fg3, width: 70, fontWeight: 500 }}>{v}</div>
              <Pagination current={3} total={7} variant={v} theme={t} />
            </div>
          ))}
        </div>
      </Section>

      {/* ── ALERT / BANNER ── */}
      <Section title="Alert / Banner">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 480 }}>
          {['default', 'bar', 'filled'].map(v => (
            <div key={v}>
              <div style={{ fontSize: 10, color: t.fg3, marginBottom: 8, fontWeight: 500 }}>{v}</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <Alert message="New version available — update now." type="info" variant={v} theme={t} />
                <Alert message="Changes saved successfully." type="success" variant={v} theme={t} />
                <Alert message="Unable to connect to server." type="error" variant={v} theme={t} />
              </div>
            </div>
          ))}
        </div>
      </Section>

      {/* ── SKELETON LOADER ── */}
      <Section title="Skeleton Loader">
        <div style={{ display: 'flex', gap: 32, maxWidth: 480 }}>
          {['pulse', 'shimmer'].map(v => (
            <Variant key={v} label={v}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <Skeleton variant={v} width={120} height={14} theme={t} />
                <Skeleton variant={v} width="100%" height={10} theme={t} />
                <Skeleton variant={v} width="80%" height={10} theme={t} />
                <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                  <Skeleton variant={v} width={32} height={32} radius="50%" theme={t} />
                  <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 6, justifyContent: 'center' }}>
                    <Skeleton variant={v} width="60%" height={10} theme={t} />
                    <Skeleton variant={v} width="40%" height={8} theme={t} />
                  </div>
                </div>
              </div>
            </Variant>
          ))}
        </div>
      </Section>

      {/* Tweaks */}
      {tweaksVisible && (
        <div style={{
          position: 'fixed', bottom: 16, right: 16, width: 240,
          background: t.raisedBg, border: `1px solid ${t.border}`, borderRadius: t.radiusLg,
          padding: 16, fontFamily: t.font, zIndex: 999,
          boxShadow: t.mode === 'dark' ? '0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)' : '0 8px 32px rgba(0,0,0,0.12)',
        }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: t.fg1, marginBottom: 12 }}>Tweaks</div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 11, color: t.fg3, marginBottom: 4 }}>Hue: {hue}°</div>
            <input type="range" min="0" max="360" step="1" value={hue}
              onChange={(e) => setHue(parseInt(e.target.value))}
              style={{ width: '100%', accentColor: t.accentSolid }} />
            <div style={{ display: 'flex', gap: 4, marginTop: 8, flexWrap: 'wrap' }}>
              {[
                { label: 'Blue', h: 265 }, { label: 'Purple', h: 300 }, { label: 'Green', h: 150 },
                { label: 'Orange', h: 54 }, { label: 'Red', h: 15 }, { label: 'Cyan', h: 200 },
              ].map((p) => (
                <div key={p.h} onClick={() => setHue(p.h)} style={{
                  padding: '3px 8px', fontSize: 10, borderRadius: t.radius, cursor: 'pointer',
                  background: hue === p.h ? t.accentSubtle : t.subtleBg,
                  color: hue === p.h ? t.accentText : t.fg3,
                  border: `1px solid ${hue === p.h ? t.accentSolid : t.border}`, fontWeight: 500,
                }}>{p.label}</div>
              ))}
            </div>
          </div>
          <div>
            <div style={{ fontSize: 11, color: t.fg3, marginBottom: 4 }}>Mode</div>
            <div style={{ display: 'flex', gap: 4 }}>
              {['dark', 'light'].map((m) => (
                <div key={m} onClick={() => setMode(m)} style={{
                  flex: 1, padding: '5px 0', textAlign: 'center', fontSize: 12, borderRadius: t.radius, cursor: 'pointer',
                  background: mode === m ? t.accentSubtle : 'transparent',
                  color: mode === m ? t.accentText : t.fg3,
                  fontWeight: mode === m ? 500 : 400,
                  border: `1px solid ${mode === m ? t.accentSolid : t.border}`,
                }}>{m}</div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
