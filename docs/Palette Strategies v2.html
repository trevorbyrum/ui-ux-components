<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palette Strategies v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const sans = '"DM Sans", sans-serif';
const serif = '"Source Serif 4", serif';

function StrategyCard({ s }) {
  return (
    <div style={{ width: 520, fontFamily: sans, borderRadius: 2, overflow: 'hidden' }}>
      <div style={{ background: s.headerBg, color: s.headerFg, padding: '28px 32px' }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.5, textTransform: 'uppercase', opacity: 0.6, marginBottom: 6 }}>{s.label}</div>
        <div style={{ fontFamily: serif, fontSize: 26, fontWeight: 400, letterSpacing: -0.3 }}>{s.name}</div>
        <div style={{ fontSize: 13, marginTop: 6, opacity: 0.75, lineHeight: 1.5 }}>{s.desc}</div>
      </div>
      <div style={{ display: 'flex', height: 48 }}>
        {s.strip.map((c, i) => <div key={i} style={{ flex: 1, background: c }} />)}
      </div>
      <div style={{ background: s.pageBg, padding: 28 }}>
        <div style={{ display: 'flex', gap: 10, marginBottom: 20, flexWrap: 'wrap', alignItems: 'center' }}>
          <button style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, padding: '8px 18px', background: s.btnPrimary, color: s.btnPrimaryFg, border: 'none', borderRadius: 6, cursor: 'pointer' }}>Primary</button>
          {s.btnSecondary && <button style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, padding: '8px 18px', background: s.btnSecondary, color: s.btnSecondaryFg, border: 'none', borderRadius: 6, cursor: 'pointer' }}>Secondary</button>}
          <button style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, padding: '8px 18px', background: 'transparent', color: s.textPrimary, border: `1.5px solid ${s.borderColor}`, borderRadius: 6, cursor: 'pointer' }}>Outline</button>
        </div>
        <div style={{ background: s.cardBg, borderRadius: 6, padding: 18, border: `1px solid ${s.borderColor}`, boxShadow: '0 1px 4px rgba(0,0,0,0.06)', display: 'flex', gap: 14, alignItems: 'center', marginBottom: 16 }}>
          <div style={{ width: 42, height: 42, borderRadius: 6, background: s.iconBg, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ width: 18, height: 18, borderRadius: '50%', background: s.iconFg }} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: s.textPrimary }}>Card heading</div>
            <div style={{ fontSize: 13, color: s.textSecondary }}>Supporting description text</div>
          </div>
          <div style={{ fontSize: 12, fontWeight: 500, color: s.linkColor, cursor: 'pointer' }}>View →</div>
        </div>
        <div style={{ padding: '9px 14px', borderRadius: 6, fontSize: 13, fontFamily: sans, border: `1.5px solid ${s.borderColor}`, background: s.inputBg, color: s.textTertiary }}>Search or type a command…</div>
      </div>
    </div>
  );
}

/* ── 1. Single Accent — Warm Coral ── */
const coral = {
  label: 'Strategy 1 · Single Accent', name: 'Coral Spark',
  desc: 'One warm coral accent against cool grays. Energetic but not loud.',
  headerBg: '#2c1f1a', headerFg: '#f5e8e2',
  strip: ['#2c1f1a', '#7a5a4a', '#c98a72', '#e8a88e', '#f5ddd2', '#faf5f2', '#ffffff'],
  pageBg: '#faf5f2', cardBg: '#fff', inputBg: '#fff',
  borderColor: '#e8ddd5',
  btnPrimary: '#c97a5e', btnPrimaryFg: '#fff',
  btnSecondary: null,
  textPrimary: '#2c1f1a', textSecondary: '#7a6a5e', textTertiary: '#a89888',
  linkColor: '#c97a5e',
  iconBg: '#f5ddd2', iconFg: '#c97a5e',
};

/* ── 2. Duotone — Forest + Gold ── */
const forestGold = {
  label: 'Strategy 2 · Duotone', name: 'Forest & Gold',
  desc: 'Deep forest green for primary actions, warm gold for highlights. Two colors, two roles.',
  headerBg: '#1a2e1e', headerFg: '#d8e8cc',
  strip: ['#1a2e1e', '#2d5a36', '#4a8a55', '#c8a84a', '#e8d88a', '#f2f5ee', '#ffffff'],
  pageBg: '#f2f5ee', cardBg: '#fff', inputBg: '#fff',
  borderColor: '#d5dece',
  btnPrimary: '#2d6e3a', btnPrimaryFg: '#fff',
  btnSecondary: '#c8a030', btnSecondaryFg: '#1a2e1e',
  textPrimary: '#1a2e1e', textSecondary: '#5a6e54', textTertiary: '#8a9a82',
  linkColor: '#2d6e3a',
  iconBg: '#e8d88a', iconFg: '#8a7520',
};

/* ── 3. Tinted Neutrals — Olive tint ── */
const oliveTint = {
  label: 'Strategy 3 · Tinted Neutrals', name: 'Olive Wash',
  desc: 'Every surface carries a subtle olive undertone. No pure grays anywhere. Warm, cohesive, earthy.',
  headerBg: '#2a2c22', headerFg: '#dce0c8',
  strip: ['#2a2c22', '#4a4e3a', '#7a7e68', '#b0b49a', '#d8dcc8', '#f0f2e8', '#f8f9f4'],
  pageBg: '#f4f5ef', cardBg: '#fafbf6', inputBg: '#f8f9f4',
  borderColor: '#d5d8c8',
  btnPrimary: '#5a6644', btnPrimaryFg: '#f8f9f4',
  btnSecondary: null,
  textPrimary: '#2a2c22', textSecondary: '#5e6250', textTertiary: '#8a8e78',
  linkColor: '#5a6644',
  iconBg: '#e2e6d0', iconFg: '#5a6644',
};

/* ── 4. Dark-Forward — Electric Cyan ── */
const darkCyan = {
  label: 'Strategy 4 · Dark-Forward', name: 'Midnight Cyan',
  desc: 'Dark is the identity. Electric cyan cuts through a charcoal palette.',
  headerBg: '#06080c', headerFg: '#c0e8f0',
  strip: ['#06080c', '#10161e', '#1c2430', '#2e3a48', '#00c8d8', '#80e8f0', '#e0f8fa'],
  pageBg: '#0e1218', cardBg: '#161c24', inputBg: '#161c24',
  borderColor: '#2a3440',
  btnPrimary: '#00b8c8', btnPrimaryFg: '#0a0e12',
  btnSecondary: '#2e5a60', btnSecondaryFg: '#c0f0f4',
  textPrimary: '#e0e8f0', textSecondary: '#8898a8', textTertiary: '#5a6878',
  linkColor: '#00c8d8',
  iconBg: '#1e2a32', iconFg: '#00c8d8',
};

/* ── 5. Analogous — Plum → Magenta → Pink ── */
const plumRange = {
  label: 'Strategy 5 · Analogous Range', name: 'Plum Spectrum',
  desc: 'Three neighboring warm hues — plum, magenta, rose — for a rich, expressive multi-color system.',
  headerBg: '#2a1428', headerFg: '#f0d8ee',
  strip: ['#6a2a68', '#a83a78', '#d85a80', '#f09aaa', '#f8d0da', '#faf2f4', '#ffffff'],
  pageBg: '#faf2f5', cardBg: '#fff', inputBg: '#fff',
  borderColor: '#e8d0da',
  btnPrimary: '#9a2a70', btnPrimaryFg: '#fff',
  btnSecondary: '#d85a80', btnSecondaryFg: '#fff',
  textPrimary: '#2a1428', textSecondary: '#785068', textTertiary: '#a88898',
  linkColor: '#9a2a70',
  iconBg: '#f8d0da', iconFg: '#a83a78',
};

/* ── 6. Contrast Pop — Grayscale + Chartreuse ── */
const chartreusePop = {
  label: 'Strategy 6 · Contrast Pop', name: 'Grayscale + Chartreuse',
  desc: 'Fully monochrome system. One electric chartreuse for the moments that matter.',
  headerBg: '#141414', headerFg: '#e8e8e8',
  strip: ['#141414', '#3a3a3a', '#6a6a6a', '#aaaaaa', '#e0e0e0', '#f5f5f5', '#b8f030'],
  pageBg: '#f5f5f5', cardBg: '#fff', inputBg: '#fff',
  borderColor: '#e0e0e0',
  btnPrimary: '#8ac020', btnPrimaryFg: '#141414',
  btnSecondary: null,
  textPrimary: '#141414', textSecondary: '#6a6a6a', textTertiary: '#aaaaaa',
  linkColor: '#6a9a18',
  iconBg: '#e8f8c0', iconFg: '#6a9a18',
};

function App() {
  return (
    <DesignCanvas>
      <DCSection title="Palette Strategies — Now with Actual Variety" subtitle="Each card uses a completely different color world. Focus on which vibe + structure appeals to you.">
        <DCArtboard label="1 · Coral Spark" width={520} height={460}>
          <StrategyCard s={coral} />
        </DCArtboard>
        <DCArtboard label="2 · Forest & Gold" width={520} height={460}>
          <StrategyCard s={forestGold} />
        </DCArtboard>
        <DCArtboard label="3 · Olive Wash" width={520} height={460}>
          <StrategyCard s={oliveTint} />
        </DCArtboard>
      </DCSection>

      <DCSection title="Bolder Approaches" subtitle="Dark-first, multi-hue, and monochrome + pop.">
        <DCArtboard label="4 · Midnight Cyan" width={520} height={460}>
          <StrategyCard s={darkCyan} />
        </DCArtboard>
        <DCArtboard label="5 · Plum Spectrum" width={520} height={460}>
          <StrategyCard s={plumRange} />
        </DCArtboard>
        <DCArtboard label="6 · Grayscale + Chartreuse" width={520} height={460}>
          <StrategyCard s={chartreusePop} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
